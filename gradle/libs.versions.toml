[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose-bom = "2026.06.01"
coroutines = "1.11.0"
# 1.9.0 keeps kotlin-stdlib at 2.2.x for apps on Kotlin 2.2 (README: Requirements); 1.12.0 pulled in 2.4.10.
serialization = "1.9.0"
okhttp = "5.4.0"
datastore = "1.3.0"
work = "2.12.0"
startup = "1.2.0"
lifecycle = "2.10.0"
activity = "1.13.0"
core-ktx = "1.18.0"
exifinterface = "1.4.2"
firebase-messaging = "26.0.1"
billing = "9.1.0"
play-review = "2.0.2"
revenuecat = "11.0.1"
superwall = "2.9.0"
adapty = "4.3.0"
junit4 = "4.13.2"
turbine = "1.2.1"
robolectric = "4.17"
roborazzi = "1.77.0"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
bcv = "0.18.2"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
dokka = "2.2.0"
detekt = "2.0.0-alpha.6"
compose-rules = "0.6.8"

[libraries]
revenuecat-purchases = { module = "com.revenuecat.purchases:purchases", version.ref = "revenuecat" }
revenuecat-purchases-ui = { module = "com.revenuecat.purchases:purchases-ui", version.ref = "revenuecat" }
superwall-android = { module = "com.superwall.sdk:superwall-android", version.ref = "superwall" }
adapty-sdk = { module = "io.adapty:android-sdk", version.ref = "adapty" }
adapty-ui = { module = "io.adapty:android-ui", version.ref = "adapty" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
play-review = { module = "com.google.android.play:review", version.ref = "play-review" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
