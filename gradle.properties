org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.experimental.enableTestFixturesKotlinSupport=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Snapshots: every test run (and so `build`) verifies against Snapshots/ and fails on a changed image.
# `recordRoborazziDebug` and `compareRoborazziDebug` override this for their own run.
roborazzi.test.verify=true
